# Static analysis of this repository's C# sources with GitHub CodeQL.
#
# The analysis matrix lists exactly one language, 'csharp', because this
# repository contains only C# sources (three Program.cs files plus their
# .csproj files; GitHub's own language detection reports "C#" for the repo).
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '21 11 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    # The lessons are compiled .NET projects, so the database is built by
    # autobuild. If that fails, replace this step with explicit build steps
    # between the init and analyze steps (build-mode: manual).
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
